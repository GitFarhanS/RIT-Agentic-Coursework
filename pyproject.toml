[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coursework"
version = "0.1.0"
description = "RIT coursework agents and SDK. Install with: pip install -e ."
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "requests>=2.33.1",
    "scipy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
